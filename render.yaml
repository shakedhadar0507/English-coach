# Render blueprint — free plan only. Secrets are set in the Render dashboard (sync: false), never committed.
services:
  - type: web
    name: english-coach
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: AI_PROVIDER
        value: none
      - key: AI_FEATURE_REALTIME
        value: "false"
